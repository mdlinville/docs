name: Lychee production link checker
on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "5 0 1 * *" # In UTC, currently 12:05 AM on the 1st of each month

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - uses: actions/checkout@v6

      - name: Download and parse sitemap
        run: |
          curl -s https://docs.wandb.ai/sitemap.xml | \
          grep -o '<loc>[^<]*</loc>' | \
          sed 's/<loc>//g; s/<\/loc>//g' > urls.txt
          echo "Found $(wc -l < urls.txt) URLs in sitemap"

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--threads 5 --max-retries 5 --retry-wait-time 2 --include '^https?://' --include '^http?://' urls.txt"
          output: ./lychee-report.md
          format: markdown
          fail: false
        env:
          # to be used in case rate limits are surpassed
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Fix broken links in docs.wandb.ai
          content-filepath: ./lychee-report.md
          labels: report, automated issue
