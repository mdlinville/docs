name: Generate SDK Release Notes

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version to generate release notes for (e.g., 0.21.1)'
        required: true
        type: string
  
  # Allow triggering from PR comments for testing
  issue_comment:
    types: [created]

jobs:
  generate-release-notes:
    # Only run on PR comments that start with "/sdk-release"
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       startsWith(github.event.comment.body, '/sdk-release'))
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Get SDK version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.sdk_version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from comment like "/sdk-release 0.21.1"
            VERSION=$(echo "${{ github.event.comment.body }}" | sed -n 's/^\/sdk-release \([0-9.]*\).*/\1/p')
            if [ -z "$VERSION" ]; then
              echo "❌ Error: Could not parse version from comment. Use format: /sdk-release 0.21.1"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
          
      - name: Post starting comment (for PR trigger)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Starting SDK release notes generation for version ${{ steps.get-version.outputs.version }}...`
            })
      
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Fetch CHANGELOG.md from wandb/wandb
        run: |
          echo "📥 Fetching CHANGELOG.md from wandb/wandb repository..."
          curl -L -o CHANGELOG.md https://raw.githubusercontent.com/wandb/wandb/main/CHANGELOG.md
          echo "✅ Downloaded CHANGELOG.md"
          echo "📊 File size: $(wc -c < CHANGELOG.md) bytes"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install emoji
          
      - name: Debug - Check directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of scripts directory:"
          ls -la scripts/
          echo "✅ Ready to generate release notes"
          
      - name: Generate release notes
        id: generate
        run: |
          set -e  # Exit on any error
          VERSION="${{ steps.get-version.outputs.version }}"
          OUTPUT_FILE="content/en/ref/release-notes/sdk/${VERSION}.md"
          
          echo "📦 Version to generate: $VERSION"
          echo "📄 Output file will be: $OUTPUT_FILE"
          
          # Check if the changelog exists
          if [ ! -f "CHANGELOG.md" ]; then
            echo "❌ Error: CHANGELOG.md not found in current directory"
            ls -la
            exit 1
          fi
          
          echo "✅ Found CHANGELOG.md"
          
          # Run the script
          python3 ./scripts/sdk-changelog-to-hugo.py \
            --changelog CHANGELOG.md \
            --output content/en/ref/release-notes/sdk \
            --version "$VERSION" || {
              echo "❌ Python script failed with exit code $?"
              exit 1
            }
          
          # Check if file was created
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ Error: Release notes file was not created at $OUTPUT_FILE"
            echo "📁 Contents of output directory:"
            ls -la content/en/ref/release-notes/sdk/ || echo "Directory not found"
            exit 1
          fi
          
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          echo "✅ Generated release notes for v$VERSION"
          
          # Clean up the downloaded CHANGELOG.md - we don't want to commit it
          echo "🧹 Cleaning up temporary CHANGELOG.md..."
          rm -f CHANGELOG.md
          
      - name: Create branch and commit
        id: create-branch
        run: |
          set -e  # Exit on error
          VERSION="${{ steps.get-version.outputs.version }}"
          BRANCH_NAME="sdk-release-notes-v${VERSION}"
          OUTPUT_FILE="${{ steps.generate.outputs.output_file }}"
          
          echo "📝 Creating branch: $BRANCH_NAME"
          echo "📄 Adding file: $OUTPUT_FILE"
          
          # Configure git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if the file exists before proceeding
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ Error: File $OUTPUT_FILE does not exist!"
            ls -la content/en/ref/release-notes/sdk/
            exit 1
          fi
          
          echo "✅ File exists, proceeding with git operations"
          
          # IMPORTANT: Add the file BEFORE creating the branch
          # This ensures the file is staged and will move with us to the new branch
          echo "➕ Adding file to git (before branch creation)..."
          git add "$OUTPUT_FILE"
          
          echo "📋 Git status after add:"
          git status
          
          # Delete the remote branch if it exists (from previous runs)
          echo "🔍 Checking for existing remote branch..."
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "🗑️ Deleting existing remote branch..."
            git push origin --delete "$BRANCH_NAME"
          else
            echo "✅ No existing remote branch found"
          fi
          
          # Create and checkout new branch (staged changes will come with us)
          echo "🌿 Creating new branch..."
          git checkout -b "$BRANCH_NAME"
          
          echo "📋 Git status on new branch:"
          git status
          
          echo "💾 Committing changes..."
          git commit -m "Add SDK release notes for v${VERSION}
          
          Generated automatically from wandb/wandb CHANGELOG.md"
          
          # Push the branch
          echo "🚀 Pushing branch to remote..."
          git push origin "$BRANCH_NAME"
          
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "✅ Successfully created branch and pushed changes"
          
      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const branch = '${{ steps.create-branch.outputs.branch }}';
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SDK Release Notes] Add v${version}`,
              head: branch,
              base: 'main',
              draft: true,
              body: `## SDK Release Notes for v${version}
            
            This PR adds release notes for W&B SDK v${version}.
            
            ### Generated from
            - Source: [wandb/wandb CHANGELOG.md](https://github.com/wandb/wandb/blob/main/CHANGELOG.md)
            - Version: v${version}
            
            ### Checklist
            - [ ] Review content for accuracy
            - [ ] Verify formatting looks correct
            - [ ] Check that all links work
            - [ ] Confirm no internal/private information is exposed
            
            ### Preview
            View the generated file: [\`content/en/ref/release-notes/sdk/${version}.md\`](https://github.com/${{ github.repository }}/blob/${branch}/content/en/ref/release-notes/sdk/${version}.md)
            
            ---
            *Generated automatically by the SDK Release Notes workflow*`
            });
            
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            return pr.number;
            
      - name: Post success comment (for PR trigger)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Successfully generated SDK release notes for v${{ steps.get-version.outputs.version }}!
            
            📝 Draft PR created: #${{ steps.create-pr.outputs.result }}
            🔗 Branch: \`${{ steps.create-branch.outputs.branch }}\`
            
            Please review the draft PR and make any necessary adjustments.`
            })
            
      - name: Post failure comment (for PR trigger)
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Failed to generate SDK release notes for v${{ steps.get-version.outputs.version }}.
            
            Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            })
